version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Tailwind CSS 4 is a deliberate framework migration, not a routine
    # dependency bump for this Tailwind 3 template. Keep compatible and
    # security updates automated while handling that migration explicitly.
    ignore:
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
